# The CI itself lives in shouni/workflows; the reasons for the job layout and tagging are in its README.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
    with:
      # Both the HTML and the headers are external input from behind a user-supplied URL.
      fuzz-targets: "./extract#FuzzText ./reader#FuzzResolveMediaType"
      fuzz-time: 60s
