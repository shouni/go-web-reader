# CI の実体は shouni/workflows。ジョブ構成とタグ運用の理由はそちらの README にある。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: shouni/workflows/.github/workflows/go-ci.yml@v1
    with:
      # HTML もヘッダーも、利用者が指定した URL の向こうから来る外部入力。
      fuzz-targets: "./extract#FuzzText ./reader#FuzzResolveMediaType"
      fuzz-time: 60s
